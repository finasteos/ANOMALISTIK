name: ci
on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - name: Block absolute local links
        run: |
          ! grep -r "file:///Users" --include="*.md" --include="*.ts" --include="*.tsx" --include="*.json" . \
            | grep -v node_modules | grep -v ".git/" || (echo "Absolute file:///Users links found" && exit 1)
      - name: Check hooks path
        run: |
          ! grep -r "ANOMALISTIK/" .cursor/hooks.json || (echo "Stale ANOMALISTIK path in hooks" && exit 1)

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python3 scripts/micro_pk_rng.py --test
